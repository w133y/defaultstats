plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.w1z4r_d'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    // CHANGE this version if it doesn't match your Paper build.
    // Check the current one at https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    // Database drivers - bundled directly into the jar (shadow), no separate install needed
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

shadowJar {
    archiveClassifier.set('')
    // Rewrites META-INF/services entries to the relocated driver class names
    mergeServiceFiles()
    relocate 'org.sqlite', 'com.w1z4r_d.defaultstats.libs.sqlite'
    relocate 'com.mysql', 'com.w1z4r_d.defaultstats.libs.mysql'
}

build {
    dependsOn shadowJar
}

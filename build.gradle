plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.w1z4r_d'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    // ЗМІНИ цю версію, якщо вона не збігається з твоїм білдом Paper.
    // Перевір актуальну на https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    // Драйвери БД - вшиваються прямо в jar (shadow), окремо встановлювати не треба
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.sqlite', 'com.w1z4r_d.defaultstats.libs.sqlite'
    relocate 'com.mysql', 'com.w1z4r_d.defaultstats.libs.mysql'
}

build {
    dependsOn shadowJar
}

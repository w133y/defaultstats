# =========================================================
#  DefaultStats config
# =========================================================

database:
  # SQLITE or MYSQL
  type: SQLITE

  sqlite:
    # File is located in the plugin folder: plugins/DefaultStats/<file>
    file: stats.db

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    useSSL: false

  # Table name prefix (useful if the database is shared with other plugins)
  table-prefix: "defstats_"

sync:
  # How often (in seconds) to save statistics for all ONLINE players to the DB
  interval-seconds: 300

  # Whether to save player statistics immediately upon leaving the server
  save-on-quit: true

# List of blocks/items for which individual mining/harvesting stats are collected.
# Tracking all game materials would be too heavy for the server,
# so only list the ones you need here.
# Names must match org.bukkit.Material enum (UPPERCASE).
# Each material adds up to ~7 columns (mined, crafted, used, broken, picked up,
# dropped). MySQL/InnoDB allows at most 1017 columns per table, so keep this
# list reasonably short (roughly under 100 entries).
track-materials:
  - STONE
  - COAL_ORE
  - IRON_ORE
  - GOLD_ORE
  - DIAMOND_ORE
  - EMERALD_ORE
  - REDSTONE_ORE
  - LAPIS_ORE
  - OAK_LOG
  - SPRUCE_LOG
  - BIRCH_LOG
  - JUNGLE_LOG
  - ACACIA_LOG
  - DARK_OAK_LOG

# List of entity types for which individual kill counts are tracked.
# Names must match org.bukkit.entity.EntityType enum (UPPERCASE).
track-entities:
  - ZOMBIE
  - SKELETON
  - CREEPER
  - SPIDER
  - ENDERMAN
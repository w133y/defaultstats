name: DefaultStats
version: '1.1.0'
main: com.w1z4r_d.defaultstats.DefaultStats
api-version: '1.21'
folia-supported: true
author: w1z4r_d
description: Collects default Minecraft player statistics into a database on a configurable interval.

commands:
  defaultstats:
    description: DefaultStats plugin commands
    aliases: [dstats]
    permission: defaultstats.admin

permissions:
  defaultstats.admin:
    description: Allows use of /defaultstats admin commands
    default: op
